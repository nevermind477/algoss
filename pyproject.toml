[project]
name = "algoss"
version = "0.1.0"
description = "Пошаговый визуализатор алгоритмов в терминале"
requires-python = ">=3.10"
dependencies = ["textual>=8.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
algoss = "algoss.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algoss"]
